services:
  game:
    build: .
    restart: unless-stopped
    environment:
      ALLOWED_ORIGINS: https://${GAME_DOMAIN:?Set GAME_DOMAIN in .env}
    expose: ["5179"]
  https:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      GAME_DOMAIN: ${GAME_DOMAIN:?Set GAME_DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [game]
volumes:
  caddy_data:
  caddy_config:
