<!doctype html><meta charset="utf-8"><title>Проверка сетевой игры на телефоне</title><style>body{background:#142a35;color:white;font:16px sans-serif}iframe{display:block;border:0;margin-top:12px}button{padding:10px}</style><button data-size="360,640">360 × 640</button><button data-size="390,844">390 × 844</button><button data-size="430,932">430 × 932</button><button data-size="360,500">360 × 500</button><button data-size="915,412">915 × 412</button><button data-size="844,390">844 × 390</button><iframe title="Телефон" width="360" height="640" src="/?qa=1&touch=1&guest=mobile-frame"></iframe><script>const frame=document.querySelector('iframe');for(const b of document.querySelectorAll('button'))b.onclick=()=>{const [w,h]=b.dataset.size.split(',');frame.width=w;frame.height=h;frame.style.transformOrigin='top left';frame.style.transform=`scale(${Math.min(1,(innerWidth-16)/Number(w),(innerHeight-76)/Number(h))})`;};</script>
